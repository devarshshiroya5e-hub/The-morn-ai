name: MornAI CI

on:
  push:
    branches: [main, 'fix/**', 'feature/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Report dependency vulnerabilities
        shell: bash
        run: |
          set +e
          npm audit --json > "$RUNNER_TEMP/mornai-npm-audit.json"
          audit_status=$?
          set -e
          node --input-type=commonjs - "$RUNNER_TEMP/mornai-npm-audit.json" "$audit_status" <<'NODE'
          const fs = require("node:fs");
          let report;
          try {
            report = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          } catch (error) {
            console.error("npm audit did not return valid JSON:", error.message);
            process.exit(1);
          }

          const counts = report.metadata?.vulnerabilities ?? {};
          console.log("npm audit severity counts:", JSON.stringify(counts));
          for (const [name, advisory] of Object.entries(report.vulnerabilities ?? {})) {
            console.log([
              advisory.severity.toUpperCase(),
              name,
              `direct=${advisory.isDirect}`,
              `range=${advisory.range}`,
              `fix=${JSON.stringify(advisory.fixAvailable ?? null)}`,
            ].join(" | "));
          }

          if (report.error) {
            console.error("npm audit request failed:", report.error.summary || report.error.code || report.error);
            process.exit(1);
          }
          if ((counts.high ?? 0) > 0 || (counts.critical ?? 0) > 0) {
            console.error("CI blocked: high or critical dependency vulnerabilities remain.");
            process.exit(1);
          }
          if (process.argv[3] !== "0" && (counts.total ?? 0) === 0) {
            console.error("npm audit exited unsuccessfully without reporting vulnerability details; check the registry/network logs.");
            process.exit(1);
          }
          NODE
      - run: npm test
      - run: npm run lint
      - run: npm run build
