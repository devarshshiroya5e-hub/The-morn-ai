name: Deploy MornAI Firebase

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "index.html"
      - "firebase.json"
      - "firestore.rules"
      - "storage.rules"
      - "firestore.indexes.json"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "scripts/render-build.cjs"
      - "public/**"
      - ".github/workflows/firebase-deploy.yml"
      - ".github/workflows/post-deploy-smoke.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build frontend
        run: npm run build

      - name: Authenticate with Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Deploy Hosting and Firestore
        run: |
          npx firebase-tools@latest deploy --project themorn-ai --only hosting,firestore:rules,firestore:indexes --non-interactive

      - name: Deploy Storage rules when the project API is enabled
        shell: bash
        run: |
          set +e
          output="$(npx firebase-tools@latest deploy --project themorn-ai --only storage --non-interactive 2>&1)"
          result=$?
          printf '%s\n' "$output"

          if [ "$result" -eq 0 ]; then
            echo "Firebase Storage rules deployed."
            exit 0
          fi

          if printf '%s' "$output" | grep -Fqi "Permissions denied enabling firebasestorage.googleapis.com"; then
            echo "::warning::Hosting and Firestore were deployed, but Storage rules were skipped because the Firebase Storage API is not enabled and this deploy identity cannot enable it. A project owner must enable the API in Google Cloud Console, then rerun this workflow."
            exit 0
          fi

          exit "$result"
