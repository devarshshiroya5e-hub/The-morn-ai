name: Deploy MornAI Firebase

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "index.html"
      - "firebase.json"
      - ".firebaserc"
      - "legacy-redirect/**"
      - "firestore.rules"
      - "storage.rules"
      - "firestore.indexes.json"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "scripts/render-build.cjs"
      - "public/**"
      - ".github/workflows/firebase-deploy.yml"
      - ".github/workflows/post-deploy-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Authenticate with Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      # Storage rules are required for a complete release. Deploy them first so
      # an IAM/default-bucket failure cannot publish a partial Hosting release.
      - name: Deploy Storage rules (required)
        shell: bash
        run: |
          set -euo pipefail
          npx firebase-tools@latest deploy --project themorn-ai --only storage --non-interactive

      - name: Deploy Hosting and Firestore
        run: |
          npx firebase-tools@latest deploy --project themorn-ai --only hosting,firestore:rules,firestore:indexes --non-interactive
