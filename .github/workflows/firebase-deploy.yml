name: Deploy MornAI Firebase

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "index.html"
      - "firebase.json"
      - "firestore.rules"
      - "storage.rules"
      - "firestore.indexes.json"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "scripts/render-build.cjs"
      - "public/**"
      - ".github/workflows/firebase-deploy.yml"
      - ".github/workflows/post-deploy-smoke.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build frontend
        run: npm run build

      - name: Authenticate with Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      # Storage is a production feature. Deploy its rules first and fail closed:
      # do not release a new Hosting/Firestore version while Storage policy deployment is blocked.
      - name: Deploy Storage rules (required for a successful deployment)
        shell: bash
        run: |
          set +e
          output="$(npx firebase-tools@latest deploy --project themorn-ai --only storage --non-interactive 2>&1)"
          result=$?
          printf '%s\\n' "$output"

          if [ "$result" -eq 0 ]; then
            echo "Firebase Storage rules deployed."
            exit 0
          fi

          if printf '%s' "$output" | grep -Fqi "Permissions denied enabling firebasestorage.googleapis.com"; then
            echo "::error::Firebase Storage rules were not deployed because the Storage API is not enabled and this deploy identity cannot enable it. A project owner must enable the API, then rerun this workflow."
          elif printf '%s' "$output" | grep -Fqi "Permission 'firebasestorage.defaultBucket.get' denied"; then
            echo "::error::Firebase Storage rules were not deployed because this deploy identity cannot read the default Storage bucket. Grant the least-privilege bucket/rules deployment permissions or confirm the default bucket is configured, then rerun this workflow."
          else
            echo "::error::Firebase Storage rules deployment failed. Hosting and Firestore will not be released by this workflow."
          fi

          exit "$result"

      - name: Deploy Hosting and Firestore
        run: |
          npx firebase-tools@latest deploy --project themorn-ai --only hosting,firestore:rules,firestore:indexes --non-interactive
