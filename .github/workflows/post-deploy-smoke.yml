name: MornAI live deployment smoke tests

on:
  workflow_run:
    workflows: ["Deploy MornAI Firebase"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firebase-hosting:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify live sitemap, crawl pages, and security headers
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import re
          import time
          import urllib.error
          import urllib.request
          import xml.etree.ElementTree as ET
          from html.parser import HTMLParser

          BASE = "https://themorn-ai.web.app"
          EXPECTED_PATHS = {
              "/",
              "/for-startup-founders/",
              "/for-skilled-contributors/",
              "/guides/build-your-startup-team/",
              "/guides/video-editors-startup-work/",
          }

          def get(url, attempts=6, delay=4):
              last_error = None
              for attempt in range(attempts):
                  try:
                      req = urllib.request.Request(
                          url,
                          headers={"User-Agent": "MornAI-Live-Smoke/1.0", "Cache-Control": "no-cache"},
                      )
                      with urllib.request.urlopen(req, timeout=20) as response:
                          return response.status, {k.lower(): v for k, v in response.headers.items()}, response.read()
                  except (urllib.error.URLError, TimeoutError, OSError) as exc:
                      last_error = exc
                      if attempt + 1 < attempts:
                          time.sleep(delay)
              raise RuntimeError(f"Unable to fetch {url} after {attempts} attempts: {last_error}")

          class PageParser(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.title = []
                  self.in_title = False
                  self.description = ""
                  self.canonical = ""
                  self.h1_count = 0
                  self.json_scripts = []
                  self.in_json = False
                  self.current_json = []

              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  tag = tag.lower()
                  if tag == "title":
                      self.in_title = True
                  elif tag == "meta" and attrs.get("name", "").lower() == "description":
                      self.description = attrs.get("content", "").strip()
                  elif tag == "link" and "canonical" in attrs.get("rel", "").lower().split():
                      self.canonical = attrs.get("href", "").strip()
                  elif tag == "h1":
                      self.h1_count += 1
                  elif tag == "script" and attrs.get("type", "").lower() == "application/ld+json":
                      self.in_json = True
                      self.current_json = []

              def handle_endtag(self, tag):
                  tag = tag.lower()
                  if tag == "title":
                      self.in_title = False
                  elif tag == "script" and self.in_json:
                      self.json_scripts.append("".join(self.current_json))
                      self.in_json = False
                      self.current_json = []

              def handle_data(self, data):
                  if self.in_title:
                      self.title.append(data)
                  if self.in_json:
                      self.current_json.append(data)

              @property
              def title_text(self):
                  return " ".join(" ".join(self.title).split())

          status, root_headers, root_html = get(BASE + "/")
          assert status == 200, f"homepage returned HTTP {status}"
          for header, expected in {
              "x-content-type-options": "nosniff",
              "x-frame-options": "DENY",
              "referrer-policy": "strict-origin-when-cross-origin",
              "cross-origin-opener-policy": "same-origin-allow-popups",
          }.items():
              actual = root_headers.get(header, "")
              assert actual.lower() == expected.lower(), f"{header}: expected {expected!r}, got {actual!r}"
          print("PASS homepage HTTP 200 and browser security headers")

          status, index_headers, index_html = get(BASE + "/index.html")
          assert status == 200, f"index.html returned HTTP {status}"
          cache_control = index_headers.get("cache-control", "").lower()
          assert "no-store" in cache_control, f"index.html cache policy is not no-store: {cache_control!r}"
          print("PASS index.html uses no-store cache policy")

          status, robots_headers, robots = get(BASE + "/robots.txt")
          robots_text = robots.decode("utf-8", "replace")
          assert status == 200, f"robots.txt returned HTTP {status}"
          assert "User-agent: *" in robots_text
          assert f"Sitemap: {BASE}/sitemap_index.xml" in robots_text
          print("PASS robots.txt advertises the production sitemap index")

          status, index_headers, index_body = get(BASE + "/sitemap_index.xml")
          assert status == 200, f"sitemap_index.xml returned HTTP {status}"
          assert "xml" in index_headers.get("content-type", "").lower()
          index_root = ET.fromstring(index_body)
          expected_index_tag = "{http://www.sitemaps.org/schemas/sitemap/0.9}sitemapindex"
          assert index_root.tag == expected_index_tag, f"unexpected sitemap index root: {index_root.tag!r}"
          sitemap_locations = [
              node.text.strip()
              for node in index_root.findall("{http://www.sitemaps.org/schemas/sitemap/0.9}sitemap/{http://www.sitemaps.org/schemas/sitemap/0.9}loc")
              if node.text
          ]
          expected_sitemap_locations = {
              f"{BASE}/page-sitemap.xml",
              f"{BASE}/guide-sitemap.xml",
          }
          assert set(sitemap_locations) == expected_sitemap_locations, f"unexpected child sitemap references: {sitemap_locations!r}"
          print("PASS sitemap_index.xml contains the two expected child sitemaps")

          ns = "{http://www.sitemaps.org/schemas/sitemap/0.9}"
          discovered_urls = []
          for sitemap_url in sorted(expected_sitemap_locations):
              status, child_headers, child_body = get(sitemap_url)
              assert status == 200, f"{sitemap_url} returned HTTP {status}"
              assert "xml" in child_headers.get("content-type", "").lower()
              child_root = ET.fromstring(child_body)
              assert child_root.tag == ns + "urlset", f"unexpected child sitemap root at {sitemap_url}: {child_root.tag!r}"
              child_urls = [
                  node.text.strip()
                  for node in child_root.findall(ns + "url/" + ns + "loc")
                  if node.text
              ]
              assert child_urls, f"{sitemap_url} contains no page URLs"
              assert len(child_urls) == len(set(child_urls)), f"{sitemap_url} contains duplicate URLs"
              discovered_urls.extend(child_urls)
              print(f"PASS child sitemap {sitemap_url} contains {len(child_urls)} URLs")

          assert len(discovered_urls) == len(set(discovered_urls)), "child sitemaps contain duplicate URLs"
          paths = set()
          for url in discovered_urls:
              match = re.fullmatch(r"https://themorn-ai\.web\.app(/.*)", url)
              assert match, f"unexpected sitemap host or protocol: {url}"
              paths.add(match.group(1))
          assert paths == EXPECTED_PATHS, f"child sitemap paths differ: found {sorted(paths)}"
          print(f"PASS sitemap index resolves to {len(discovered_urls)} unique production URLs")

          status, legacy_headers, legacy_body = get(BASE + "/sitemap.xml")
          assert status == 200, f"legacy sitemap.xml returned HTTP {status}"
          assert "xml" in legacy_headers.get("content-type", "").lower()
          legacy_root = ET.fromstring(legacy_body)
          assert legacy_root.tag == ns + "urlset", "legacy sitemap.xml is not a urlset"
          legacy_urls = [
              node.text.strip()
              for node in legacy_root.findall(ns + "url/" + ns + "loc")
              if node.text
          ]
          assert set(legacy_urls) == set(discovered_urls), "legacy sitemap.xml does not match the sitemap index URLs"
          print("PASS legacy sitemap.xml remains available and matches the sitemap index")

          for sitemap_label, sitemap_document in [
              ("sitemap index", index_body),
              ("page sitemap", get(BASE + "/page-sitemap.xml")[2]),
              ("guide sitemap", get(BASE + "/guide-sitemap.xml")[2]),
              ("legacy sitemap", legacy_body),
          ]:
              assert b'<?xml-stylesheet type="text/xsl" href="/sitemap-style.xsl"?>' in sitemap_document, f"{sitemap_label} is missing the browser stylesheet reference"

          status, xsl_headers, xsl_body = get(BASE + "/sitemap-style.xsl")
          assert status == 200, f"sitemap stylesheet returned HTTP {status}"
          assert "xsl" in xsl_headers.get("content-type", "").lower(), f"unexpected stylesheet content type: {xsl_headers.get('content-type')!r}"
          xsl_root = ET.fromstring(xsl_body)
          expected_xsl_tag = "{http://www.w3.org/1999/XSL/Transform}stylesheet"
          assert xsl_root.tag == expected_xsl_tag, f"invalid XSLT root element: {xsl_root.tag!r}"
          assert xsl_root.attrib.get("version") == "1.0", "sitemap stylesheet must use XSLT 1.0"
          print("PASS sitemap XML files reference a valid, publicly served XSLT stylesheet")

          for path in sorted(EXPECTED_PATHS):
              url = BASE + path
              status, headers, html = get(url)
              assert status == 200, f"{url} returned HTTP {status}"
              parser = PageParser()
              parser.feed(html.decode("utf-8", "replace"))
              assert parser.title_text, f"{url} is missing a title"
              assert parser.description, f"{url} is missing a meta description"
              expected_canonical = url if path != "/" else BASE + "/"
              assert parser.canonical == expected_canonical, f"{url} canonical mismatch: {parser.canonical!r}"
              if path != "/":
                  assert parser.h1_count >= 1, f"{url} is missing an H1"
              for block in parser.json_scripts:
                  json.loads(block)
              if path != "/":
                  assert parser.json_scripts, f"{url} has no JSON-LD structured data"
              print(f"PASS crawl page {url}")

          print("Firebase Hosting smoke checks passed.")
          PY

  render-api:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify Render API health, CORS, Firebase config, and auth guard
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import time
          import urllib.error
          import urllib.request

          BASE = "https://the-morn-ai.onrender.com"
          ORIGIN = "https://themorn-ai.web.app"

          def request(path, method="GET", attempts=12, delay=10):
              last_error = None
              for attempt in range(attempts):
                  req = urllib.request.Request(
                      BASE + path,
                      method=method,
                      headers={"Origin": ORIGIN, "Accept": "application/json"},
                  )
                  try:
                      with urllib.request.urlopen(req, timeout=25) as response:
                          return response.status, {k.lower(): v for k, v in response.headers.items()}, response.read()
                  except urllib.error.HTTPError as exc:
                      if exc.code >= 500 and attempt + 1 < attempts:
                          last_error = exc
                          time.sleep(delay)
                          continue
                      return exc.code, {k.lower(): v for k, v in exc.headers.items()}, exc.read()
                  except (urllib.error.URLError, TimeoutError, OSError) as exc:
                      last_error = exc
                      if attempt + 1 < attempts:
                          time.sleep(delay)
              raise RuntimeError(f"Render API did not respond after {attempts} attempts: {last_error}")

          status, headers, body = request("/api/health")
          assert status == 200, f"/api/health returned HTTP {status}: {body[:200]!r}"
          assert headers.get("access-control-allow-origin") == ORIGIN, "API CORS did not allow the production frontend origin"
          health = json.loads(body)
          assert health.get("status") == "ok", f"unexpected health payload: {health!r}"
          print("PASS Render /api/health and production CORS")

          status, _, body = request("/api/firebase-config")
          assert status == 200, f"/api/firebase-config returned HTTP {status}: {body[:200]!r}"
          config = json.loads(body)
          assert isinstance(config.get("apiKey"), str) and config["apiKey"]
          assert config.get("projectId") == "themorn-ai", f"unexpected Firebase project id: {config.get('projectId')!r}"
          print("PASS Render Firebase public config route")

          status, _, body = request("/api/ai/status")
          assert status == 401, f"unauthenticated /api/ai/status should be rejected with 401; got HTTP {status}: {body[:200]!r}"
          print("PASS Render rejects unauthenticated AI API requests")
          PY
