name: Repair MornAI runtime error

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[runtime-repair]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix missing currency formatter argument
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/components/MarketplacePage.tsx')
          text = path.read_text()
          old = 'getRolePartnershipSummary(role)</p>'
          new = 'getRolePartnershipSummary(role, formatMoney)</p>'
          if old not in text:
              raise SystemExit('Expected runtime bug pattern was not found')
          text = text.replace(old, new, 1)
          path.write_text(text)
          PY

      - name: Commit runtime fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/MarketplacePage.tsx
          git commit -m 'Fix MornAI runtime formatter error [runtime-repair]'
          git push
