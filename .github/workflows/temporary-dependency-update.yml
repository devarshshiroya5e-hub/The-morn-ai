name: Temporary non-breaking dependency update

on:
  push:
    branches: [fix/dependency-audit-autofix]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Apply npm audit fixes without major-version changes
        shell: bash
        run: |
          set +e
          npm audit fix --ignore-scripts
          result=$?
          set -e
          echo "npm audit fix exit code: $result (remaining advisories are reported next)"
      - name: Report remaining advisories
        shell: bash
        run: |
          set +e
          npm audit --json > "$RUNNER_TEMP/mornai-npm-audit.json"
          set -e
          node --input-type=commonjs - "$RUNNER_TEMP/mornai-npm-audit.json" <<'NODE'
          const fs = require("node:fs");
          let report;
          try {
            report = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          } catch (error) {
            console.error("Could not parse npm audit output:", error.message);
            process.exit(0);
          }
          console.log("npm audit severity counts:", JSON.stringify(report.metadata?.vulnerabilities ?? {}));
          for (const [name, advisory] of Object.entries(report.vulnerabilities ?? {})) {
            const via = (advisory.via ?? []).map((item) => typeof item === "string" ? item : `${item.name}: ${item.title || item.url || item.range}`);
            console.log([
              advisory.severity.toUpperCase(),
              name,
              `installed=${advisory.range}`,
              `direct=${advisory.isDirect}`,
              `fix=${JSON.stringify(advisory.fixAvailable ?? null)}`,
              `advisories=${via.join("; ")}`,
            ].join(" | "));
          }
          NODE
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - name: Commit lockfile changes back to this branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No compatible dependency updates were available."
            exit 0
          fi
          git commit -m "Apply compatible npm audit fixes"
          git push origin "HEAD:${GITHUB_REF_NAME}"
